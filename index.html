<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co.opmart Đà Nẵng - Hệ Thống Quản Lý Nhân Sự</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --blue: #005691; --red: #ed1c24; --green: #27ae60; --bg: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        
        /* Header */
        header { background: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--red); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        #logo-img { height: 55px; cursor: pointer; border-radius: 6px; border: 1px solid #e2e8f0; padding: 4px; }
        .title-area h1 { color: var(--blue); margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .title-area p { margin: 0; color: var(--red); font-weight: 700; font-size: 0.8rem; }

        /* Main Dashboard */
        .dashboard { display: grid; grid-template-columns: 380px 1fr; gap: 24px; padding: 24px 5%; max-width: 1500px; margin: auto; }
        
        /* Scanner Section */
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #f1f5f9; background: #000; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
        .btn { padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        /* Stats & Table */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .stat-card { background: var(--blue); color: white; padding: 20px; border-radius: 16px; display: flex; align-items: center; gap: 16px; }
        .stat-card.red { background: var(--red); }
        .stat-card i { font-size: 2rem; opacity: 0.7; }
        .stat-num { font-size: 2rem; font-weight: 800; }

        .table-container { background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 16px; text-align: left; color: var(--blue); font-size: 0.85rem; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
        td { padding: 16px; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
        
        .badge { padding: 6px 12px; border-radius: 9999px; font-weight: 600; font-size: 0.75rem; }
        .badge-in { background: #dcfce7; color: #166534; }
        .badge-out { background: #fee2e2; color: #991b1b; }

        /* Overlay & Toast */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border-radius: 12px; }
        #toast { position: fixed; bottom: 30px; right: 30px; padding: 16px 32px; border-radius: 12px; color: white; font-weight: 700; z-index: 1000; display: none; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); animation: slideUp 0.3s ease-out; }

        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        #hidden-input { position: fixed; top: -100px; }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <input type="file" id="logo-uploader" hidden accept="image/*">
        <img src="https://media.loveitopcdn.com/3807/logo-coopmart-compressed.jpg" id="logo-img" title="Thay đổi Logo">
        <div class="title-area">
            <h1>Co.opmart Đà Nẵng</h1>
            <p><i class="fa-solid fa-circle-check"></i> HR ATTENDANCE SYSTEM</p>
        </div>
    </div>
    <div id="real-time" style="color: var(--blue); font-weight: 800;"></div>
</header>

<div class="dashboard">
    <div class="left-panel">
        <div class="card">
            <h3 style="margin: 0 0 15px 0; font-size: 1.1rem;"><i class="fa-solid fa-expand"></i> Quét mã QR</h3>
            <div style="position: relative;">
                <div id="reader"></div>
                <div id="overlay">
                    <i class="fa-solid fa-hourglass-half fa-spin" style="font-size: 2rem; color: var(--blue);"></i>
                    <p style="font-weight: 700; margin-top: 10px; color: var(--blue);">Đang xử lý (3s)...</p>
                </div>
            </div>
            <div class="btn-grid">
                <button class="btn btn-blue" onclick="startScanner('environment')"><i class="fa-solid fa-camera"></i> Cam Sau</button>
                <button class="btn btn-blue" onclick="startScanner('user')"><i class="fa-solid fa-video"></i> Cam Trước</button>
                <button class="btn btn-red" style="grid-column: span 2;" onclick="stopScanner()"><i class="fa-solid fa-power-off"></i> Tắt Camera</button>
            </div>
            <p style="font-size: 11px; color: #64748b; margin-top: 15px; text-align: center;">
                <i class="fa-solid fa-keyboard"></i> Sẵn sàng cho máy quét vật lý
            </p>
        </div>
    </div>

    <div class="right-panel">
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-user-check"></i>
                <div>
                    <div class="stat-num" id="active-num">0</div>
                    <div style="font-size: 0.8rem; opacity: 0.9; text-transform: uppercase;">Đang trong ca</div>
                </div>
            </div>
            <div class="stat-card red">
                <i class="fa-solid fa-clock"></i>
                <div>
                    <div class="stat-num" id="sync-time">--:--</div>
                    <div style="font-size: 0.8rem; opacity: 0.9; text-transform: uppercase;">Cập nhật cuối</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nhân Viên</th>
                        <th>Bộ Phận</th>
                        <th>Vào Ca</th>
                        <th>Ra Ca</th>
                        <th style="text-align:center;">Phút Làm</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <tr><td colspan="5" style="text-align:center; padding:60px; color:#94a3b8;">Đang chờ tín hiệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<input type="text" id="hidden-input" autofocus>
<div id="toast"></div>

<script>
    // --- CẤU HÌNH ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzhG-OMWbFIXeRQhraIGT7Tt56yQP-m7QuJqqsKJiIPk4vw0xKPwnTmfp8KmWp0jvXqA/exec";
    
    let html5QrCode;
    let isLocked = false;
    const hInput = document.getElementById('hidden-input');

    // 1. Camera Control
    function startScanner(mode) {
        if (html5QrCode) {
            html5QrCode.stop().then(() => init(mode));
        } else {
            init(mode);
        }
    }

    function init(mode) {
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 20, qrbox: { width: 260, height: 260 }, aspectRatio: 1.0 };
        html5QrCode.start({ facingMode: mode }, config, (decodedText) => {
            if (!isLocked) handleData(decodedText);
        }).catch(() => alert("Không mở được camera. Vui lòng sử dụng HTTPS hoặc kiểm tra quyền!"));
    }

    function stopScanner() { if(html5QrCode) html5QrCode.stop(); }

    // 2. Physical Scanner Focus
    document.addEventListener('click', () => hInput.focus());
    hInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if(!isLocked) handleData(hInput.value);
            hInput.value = '';
        }
    });

    // 3. Data Processing
    async function handleData(id) {
        isLocked = true;
        document.getElementById('overlay').style.display = 'flex';
        
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Chế độ này giúp gửi dữ liệu mượt hơn qua Google
                body: JSON.stringify({ id: id })
            });
            
            showToast("Đã xử lý mã: " + id, "var(--blue)");
            // Sau khi gửi, đợi 1s để Sheet cập nhật rồi load lại bảng
            setTimeout(loadData, 1000);

        } catch (error) {
            showToast("Lỗi máy chủ!", "var(--red)");
        }

        // Khóa 3 giây chống quét lặp
        setTimeout(() => {
            isLocked = false;
            document.getElementById('overlay').style.display = 'none';
        }, 3000);
    }

    // 4. Sync Data (GET)
    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            document.getElementById('active-num').innerText = data.activeCount;
            document.getElementById('sync-time').innerText = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
            
            const tbody = document.getElementById('log-body');
            tbody.innerHTML = data.allData.map(row => `
                <tr style="animation: slideUp 0.4s ease">
                    <td><strong>${row.name}</strong><br><small style="color:#64748b">${row.id}</small></td>
                    <td><span style="font-size: 0.8rem;">${row.dept}</span></td>
                    <td><span class="badge badge-in">${row.timeIn}</span></td>
                    <td><span class="badge badge-out">${row.timeOut || '---'}</span></td>
                    <td style="text-align:center;">
                        ${row.totalMins ? `<b style="color:var(--green)">${row.totalMins}</b>` : '<i style="color:#cbd5e1">...</i>'}
                    </td>
                </tr>
            `).join('');
        } catch (e) { console.warn("Syncing..."); }
    }

    // Tiện ích
    function showToast(msg, color) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.background = color; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    document.getElementById('logo-img').onclick = () => document.getElementById('logo-uploader').click();
    document.getElementById('logo-uploader').onchange = (e) => {
        const r = new FileReader();
        r.onload = (ev) => document.getElementById('logo-img').src = ev.target.result;
        r.readAsDataURL(e.target.files[0]);
    };

    setInterval(() => {
        document.getElementById('real-time').innerText = new Date().toLocaleString('vi-VN');
    }, 1000);

    // Tự động làm mới bảng mỗi 5 giây
    setInterval(loadData, 5000);
    window.onload = loadData;

</script>
</body>
</html>
